# Render Blueprint — deploys the Elyxion registry server
# (https://xyz-elyxion.onrender.com)
#
# Deploy: push to main, or use the Render dashboard "New > Blueprint"
# and point it at this repo.
#
# NOTE: persistent disks require a paid Render instance type. On the free
# tier, remove the `disk` block — data (users/packages) then lives in the
# container's ephemeral filesystem and resets on redeploy.
services:
  - type: web
    name: elyxion
    runtime: docker
    repo: https://github.com/xyz-elyxion/elyxion-cli
    dockerfilePath: ./site/Dockerfile
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: PUBLIC_URL
        value: https://xyz-elyxion.onrender.com
    # disk:
    #   name: elyxion-data
    #   mountPath: /data
    #   sizeGB: 1
