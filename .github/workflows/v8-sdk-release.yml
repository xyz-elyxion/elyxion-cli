name: V8 SDK Release

on:
  workflow_dispatch:
    inputs:
      v8_version:
        description: V8 release tag to build
        required: false
        default: 12.2.281.28
      release_tag:
        description: Git tag for the SDK release
        required: false
        default: v8-sdk-12.2.281.28

permissions:
  contents: write

env:
  V8_VERSION: ${{ inputs.v8_version || '12.2.281.28' }}
  SDK_RELEASE_TAG: ${{ inputs.release_tag || 'v8-sdk-12.2.281.28' }}

jobs:
  build-sdk:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            archive: v8-sdk-linux-x64.tar.xz
          # V8 12.2's bundled libc++ requires max_align_t from the macOS SDK.
          # Apple removed it from the macOS 26 SDK (Xcode 26), which breaks the
          # build, so build the macOS SDK on the macOS 15 runner (Xcode 16.4 /
          # macOS 15.5 SDK) instead of macos-latest (which is macOS 26).
          - os: macos-15
            platform: macos
            archive: v8-sdk-macos.tar.xz
          - os: windows-latest
            platform: windows-x64
            archive: v8-sdk-windows-x64.tar.xz

    steps:
      - name: Checkout Elyxion scripts
        uses: actions/checkout@v4

      - name: Install Linux tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y git cmake g++ make curl xz-utils tar python3

      - name: Install macOS tools
        if: runner.os == 'macOS'
        run: brew install cmake xz || true

      # Pin Xcode 16.4 so GN picks the macOS 15.5 SDK. The macos-15 image also
      # ships Xcode 26.x; if its default Xcode ever flips to 26, the SDK build
      # would hit the max_align_t removal again.
      - name: Build V8 SDK on Unix
        if: runner.os != 'Windows'
        shell: bash
        env:
          JOBS: 2
          DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
        run: |
          set -euo pipefail
          chmod +x scripts/build-v8.sh
          ./scripts/build-v8.sh \
            --version "$V8_VERSION" \
            --out "$RUNNER_TEMP/v8-sdk"
          mkdir -p "$RUNNER_TEMP/sdk-archive"
          cp -R "$RUNNER_TEMP/v8-sdk/." "$RUNNER_TEMP/sdk-archive/"
          tar -cJf "${{ matrix.archive }}" -C "$RUNNER_TEMP/sdk-archive" .

      - name: Build V8 SDK on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\scripts\build-v8.ps1 -Version "$env:V8_VERSION" -OutDir "$env:RUNNER_TEMP\v8-sdk"
          if (-not (Test-Path "$env:RUNNER_TEMP\v8-sdk\include\v8.h")) { throw 'include/v8.h missing' }
          if (-not ((Test-Path "$env:RUNNER_TEMP\v8-sdk\v8_monolith.lib") -or (Test-Path "$env:RUNNER_TEMP\v8-sdk\v8_monolith.dll.lib"))) { throw 'V8 monolith library missing' }
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\sdk-archive" | Out-Null
          Copy-Item -Recurse "$env:RUNNER_TEMP\v8-sdk\*" "$env:RUNNER_TEMP\sdk-archive\" -Force
          tar -cJf "${{ matrix.archive }}" -C "$env:RUNNER_TEMP\sdk-archive" .

      - name: Verify SDK archive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          tar -tJf "${{ matrix.archive }}" | grep -Fx './include/v8.h'
          if [[ "$RUNNER_OS" == "Linux" || "$RUNNER_OS" == "macOS" ]]; then
            tar -tJf "${{ matrix.archive }}" | grep -Fx './libv8_monolith.a'
          fi

      - name: Verify SDK archive on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $entries = tar -tJf "${{ matrix.archive }}"
          if (-not ($entries -contains './include/v8.h')) { throw 'include/v8.h missing' }
          if (-not (($entries -contains './v8_monolith.lib') -or ($entries -contains './v8_monolith.dll.lib'))) {
            throw 'Windows V8 monolith library missing'
          }

      - name: Upload SDK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdk-${{ matrix.platform }}
          path: ${{ matrix.archive }}

  publish:
    runs-on: ubuntu-latest
    needs: build-sdk
    steps:
      - name: Download SDK artifacts
        uses: actions/download-artifact@v4
        with:
          path: sdk-assets
          merge-multiple: true

      - name: Create SDK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.SDK_RELEASE_TAG }}
          name: V8 SDK ${{ env.V8_VERSION }}
          body: |
            Standalone V8 SDK archives for Elyxion.

            Archives contain only the public headers and monolithic library; the V8 source checkout and .git metadata are excluded.
          files: sdk-assets/*
          generate_release_notes: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
