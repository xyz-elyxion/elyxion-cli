name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  V8_SDK_URL: ${{ vars.V8_SDK_URL }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ make curl xz-utils tar

      - name: Download standalone V8 SDK
        run: |
          test -n "$V8_SDK_URL"
          mkdir -p "$RUNNER_TEMP/v8"
          curl -fsSL "$V8_SDK_URL" | tar -xJ --strip-components=1 -C "$RUNNER_TEMP/v8"

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DV8_DIR="$RUNNER_TEMP/v8"

      - name: Build
        run: cmake --build build --config Release

      - name: Smoke test
        run: |
          ./build/elyxion --version
          ./build/elyxion --help
          ./build/elyxion examples/hello.js
          printf 'console.log("stdin ok")\n' | ./build/elyxion
