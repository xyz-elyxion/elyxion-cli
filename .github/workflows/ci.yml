name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node.js 22.x
      uses: actions/setup-node@v4
      with:
        node-version: 22.x

    - name: Install Dependencies
      run: npm install --ignore-scripts

    - name: Lint JavaScript
      run: |
        echo "=== Linting JavaScript files ==="
        find lib/ -name "*.js" -exec node --check {} \;
        echo "=== Lint passed ==="

  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [20.x, 22.x]

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Install Dependencies
      shell: bash
      run: npm install --ignore-scripts

    # ---- Linux / macOS Build ----
    - name: Configure CMake (Linux/macOS)
      if: runner.os != 'Windows'
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build (Linux/macOS)
      if: runner.os != 'Windows'
      run: cmake --build build --config Release

    # ---- Windows Build ----
    - name: Configure CMake (Windows)
      if: runner.os == 'Windows'
      run: cmake -B build -A x64

    - name: Build (Windows)
      if: runner.os == 'Windows'
      run: cmake --build build --config Release

    - name: Test
      run: node test/basic.test.js

  test-cli:
    runs-on: ubuntu-latest
    needs: build

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node.js 22.x
      uses: actions/setup-node@v4
      with:
        node-version: 22.x

    - name: Install Dependencies
      run: npm install --ignore-scripts

    - name: Build
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=Release
        cmake --build build --config Release

    - name: Test CLI Version
      run: node bin/elyxion --version

    - name: Test CLI Help
      run: node bin/elyxion --help

    - name: Test REPL
      run: echo "process.exit(0)" | node bin/elyxion --repl || true

    - name: Test Script Execution
      run: node bin/elyxion examples/hello.js
