name: CI

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main, develop ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'

    - name: Install dependencies using elyx
      run: node bin/elyx install

    - name: Lint JavaScript
      run: |
        echo "Linting JavaScript files..."
        find lib/ -name "*.js" -exec node --check {} \;

    - name: Check C++ formatting
      run: |
        echo "Checking C++ formatting..."

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [20.x, 22.x]
        
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Install dependencies using elyx
      run: node bin/elyx install

    - name: Build native addon
      run: node-gyp rebuild

    - name: Run unit tests
      run: node bin/elyxion test/basic.test.js

    - name: Test CLI commands
      run: |
        node bin/elyxion --version
        node bin/elyxion --help
        node bin/elyxion -e "console.log('test')"
        node bin/elyx --version
        node bin/elyx --help

    - name: Test REPL
      run: |
        echo "console.log('REPL test')" | timeout 5 node bin/elyxion || true

  build-matrix:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        arch: [x64]
        include:
          - os: macos-latest
            arch: arm64
            
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'

    - name: Install dependencies using elyx
      run: node bin/elyx install

    - name: Build for ${{ matrix.os }}-${{ matrix.arch }}
      run: node-gyp rebuild

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: build-${{ matrix.os }}-${{ matrix.arch }}
        path: build/
        retention-days: 7

  coverage:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'

    - name: Install dependencies using elyx
      run: node bin/elyx install

    - name: Build
      run: node-gyp rebuild

    - name: Run tests with coverage
      run: |
        echo "Running tests with coverage..."
        node bin/elyxion test/basic.test.js

    - name: Upload coverage
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage/lcov.info
        flags: unittests
