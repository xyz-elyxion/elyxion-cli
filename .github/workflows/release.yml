name: Release Elyxion CLI

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        registry-url: 'https://registry.npmjs.org'

    - name: Install dependencies
      run: npm ci

    - name: Build native addon
      run: npm run build

    - name: Run tests
      run: npm test

    - name: Package for Linux
      if: matrix.os == 'ubuntu-latest'
      run: |
        tar -czf elyxion-linux-x64.tar.gz \
          -C . \
          bin/ \
          lib/ \
          build/ \
          package.json \
          README.md \
          LICENSE

    - name: Package for macOS
      if: matrix.os == 'macos-latest'
      run: |
        tar -czf elyxion-macos-x64.tar.gz \
          -C . \
          bin/ \
          lib/ \
          build/ \
          package.json \
          README.md \
          LICENSE

    - name: Package for Windows
      if: matrix.os == 'windows-latest'
      run: |
        7z a elyxion-windows-x64.zip bin/ lib/ build/ package.json README.md LICENSE

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: release-${{ matrix.os }}
        path: |
          elyxion-*.tar.gz
          elyxion-*.zip

  create-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts/

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        generate_release_notes: true
        files: |
          artifacts/release-ubuntu-latest/*
          artifacts/release-macos-latest/*
          artifacts/release-windows-latest/*
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-npm:
    needs: create-release
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        registry-url: 'https://registry.npmjs.org'

    - name: Install dependencies
      run: npm ci

    - name: Build
      run: npm run build

    - name: Publish to npm
      run: npm publish
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-elyx-registry:
    needs: create-release
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'

    - name: Install dependencies
      run: npm ci

    - name: Build
      run: npm run build

    - name: Publish to Elyxion Registry
      run: |
        node bin/elyx publish
      env:
        GITHUB_TOKEN: ${{ secrets.ELYX_REGISTRY_TOKEN }}
