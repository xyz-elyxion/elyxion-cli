name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  V8_SDK_URL: ${{ vars.V8_SDK_URL }}

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: elyxion-linux-x64
          - os: macos-latest
            artifact: elyxion-macos
          - os: windows-latest
            artifact: elyxion-windows-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Unix tools and V8 SDK
        if: runner.os != 'Windows'
        run: |
          test -n "$V8_SDK_URL"
          brew install cmake || true
          mkdir -p "$RUNNER_TEMP/v8"
          curl -fsSL "$V8_SDK_URL" | tar -xJ --strip-components=1 -C "$RUNNER_TEMP/v8"

      - name: Install Windows V8 SDK
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not $env:V8_SDK_URL) { throw "V8_SDK_URL is not configured" }
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\v8" | Out-Null
          Invoke-WebRequest -Uri $env:V8_SDK_URL -OutFile "$env:RUNNER_TEMP\v8.tar.xz"
          tar -xf "$env:RUNNER_TEMP\v8.tar.xz" -C "$env:RUNNER_TEMP\v8" --strip-components=1

      - name: Configure Unix
        if: runner.os != 'Windows'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DV8_DIR="$RUNNER_TEMP/v8"

      - name: Configure Windows
        if: runner.os == 'Windows'
        run: cmake -B build -A x64 -DV8_DIR="$env:RUNNER_TEMP\v8"

      - name: Build
        run: cmake --build build --config Release

      - name: Assemble Unix archive
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist/bin dist/lib
          cp build/elyxion dist/elyxion.bin
          cp -r build/runtime/lib/. dist/lib/
          cp bin/elyx dist/bin/
          cp bin/elyxion dist/bin/
          cp bin/elyxion.cmd bin/elyx.cmd dist/bin/
          cp README.md LICENSE dist/
          tar -czf "${{ matrix.artifact }}.tar.gz" -C dist .

      - name: Assemble Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dist = "${{ matrix.artifact }}"
          New-Item -ItemType Directory -Force "$dist\bin", "$dist\lib" | Out-Null
          Copy-Item build\Release\elyxion.exe "$dist\bin\"
          Copy-Item -Recurse build\runtime\lib\* "$dist\lib\"
          Copy-Item bin\elyx.cmd, bin\elyxion.cmd "$dist\bin\"
          Copy-Item README.md, LICENSE "$dist\"
          Compress-Archive -Path $dist -DestinationPath "${{ matrix.artifact }}.zip"

      - name: Upload Unix archive
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz

      - name: Upload Windows archive
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip

  publish:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
