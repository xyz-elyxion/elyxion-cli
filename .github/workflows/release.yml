name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            dist_name: elyxion-linux-x64
          - os: macos-latest
            dist_name: elyxion-macos-universal
          - os: windows-latest
            dist_name: elyxion-windows-x64

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node.js 22.x
      uses: actions/setup-node@v4
      with:
        node-version: 22.x

    - name: Install Dependencies
      shell: bash
      run: npm install --ignore-scripts

    # ---- Linux Build ----
    - name: Build (Linux)
      if: runner.os == 'Linux'
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=Release
        cmake --build build --config Release

    # ---- macOS Universal Build ----
    - name: Build x64 (macOS)
      if: runner.os == 'macOS'
      run: |
        cmake -B build-x64 -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=x86_64
        cmake --build build-x64 --config Release

    - name: Build arm64 (macOS)
      if: runner.os == 'macOS'
      run: |
        cmake -B build-arm64 -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64
        cmake --build build-arm64 --config Release

    - name: Create Universal Binary (macOS)
      if: runner.os == 'macOS'
      run: |
        mkdir -p build-x64-staging build-arm64-staging build/Release
        find build-x64 -name "elyxion.node" -exec cp {} build-x64-staging/elyxion.node \;
        find build-arm64 -name "elyxion.node" -exec cp {} build-arm64-staging/elyxion.node \;
        lipo -create build-x64-staging/elyxion.node build-arm64-staging/elyxion.node -output build/Release/elyxion.node

    # ---- Windows Build ----
    - name: Build (Windows)
      if: runner.os == 'Windows'
      run: |
        cmake -B build -A x64
        cmake --build build --config Release

    # ---- Package ----
    - name: Assemble Distribution
      shell: bash
      run: |
        DIST=${{ matrix.dist_name }}
        mkdir -p "$DIST"/bin "$DIST"/lib "$DIST"/build/Release
        cp -r bin/* "$DIST"/bin/
        cp -r lib/* "$DIST"/lib/
        cp package.json README.md "$DIST"/
        # Copy the native addon
        find build build-x64 build-arm64 -name "elyxion.node" -exec cp {} "$DIST"/build/Release/ \; 2>/dev/null || true
        cp build/Release/elyxion.node "$DIST"/build/Release/ 2>/dev/null || true

    - name: Package (Linux)
      if: runner.os == 'Linux'
      run: |
        tar -czf ${{ matrix.dist_name }}.tar.gz ${{ matrix.dist_name }}

    - name: Package (macOS)
      if: runner.os == 'macOS'
      run: |
        tar -czf ${{ matrix.dist_name }}.tar.gz ${{ matrix.dist_name }}

    - name: Package (Windows)
      if: runner.os == 'Windows'
      run: |
        Compress-Archive -Path ${{ matrix.dist_name }} -DestinationPath ${{ matrix.dist_name }}.zip

    - name: Upload Artifact (Linux)
      if: runner.os == 'Linux'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.dist_name }}
        path: ${{ matrix.dist_name }}.tar.gz

    - name: Upload Artifact (macOS)
      if: runner.os == 'macOS'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.dist_name }}
        path: ${{ matrix.dist_name }}.tar.gz

    - name: Upload Artifact (Windows)
      if: runner.os == 'Windows'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.dist_name }}
        path: ${{ matrix.dist_name }}.zip

  release:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Download All Artifacts
      uses: actions/download-artifact@v4

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          elyxion-linux-x64/elyxion-linux-x64.tar.gz
          elyxion-macos-universal/elyxion-macos-universal.tar.gz
          elyxion-windows-x64/elyxion-windows-x64.zip
        generate_release_notes: true
        draft: false
        prerelease: false
        fail_on_unmatched_files: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---- Publish to Elyxion Registry ----
  publish-registry:
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node.js 22.x
      uses: actions/setup-node@v4
      with:
        node-version: 22.x

    - name: Login to Elyxion Registry
      run: node bin/elyx login
      env:
        ELYX_TOKEN: ${{ secrets.ELYX_TOKEN }}

    - name: Publish to Elyxion Registry
      run: node bin/elyx publish --tag latest
      env:
        ELYX_TOKEN: ${{ secrets.ELYX_TOKEN }}
