name: Release

on:
  push:
    tags:
      - 'v*'
      - '!v8-sdk-*'

permissions:
  contents: write

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  V8_SDK_RELEASE_TAG: v8-sdk-12.2.281.28

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: elyxion-linux-x64
            sdk_asset: v8-sdk-linux-x64.tar.xz
          - os: macos-latest
            artifact: elyxion-macos
            sdk_asset: v8-sdk-macos.tar.xz
          - os: windows-latest
            artifact: elyxion-windows-x64
            sdk_asset: v8-sdk-windows-x64.tar.xz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ make curl xz-utils tar

      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: brew install cmake xz || true

      - name: Download V8 SDK on Unix
        if: runner.os != 'Windows'
        shell: bash
        env:
          SDK_ASSET: ${{ matrix.sdk_asset }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v8"
          sdk_url="https://github.com/${{ github.repository }}/releases/download/${V8_SDK_RELEASE_TAG}/${SDK_ASSET}"
          curl -fL --retry 3 -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" "$sdk_url" | tar -xJ --strip-components=1 -C "$RUNNER_TEMP/v8"
          test -f "$RUNNER_TEMP/v8/include/v8.h"

      - name: Download V8 SDK on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          SDK_ASSET: ${{ matrix.sdk_asset }}
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\v8" | Out-Null
          $sdkUrl = "https://github.com/${{ github.repository }}/releases/download/$env:V8_SDK_RELEASE_TAG/$env:SDK_ASSET"
          Invoke-WebRequest -Headers @{ Authorization = "Bearer $env:GITHUB_TOKEN" } -Uri $sdkUrl -OutFile "$env:RUNNER_TEMP\v8.tar.xz"
          tar -xf "$env:RUNNER_TEMP\v8.tar.xz" -C "$env:RUNNER_TEMP\v8" --strip-components=1
          if (-not (Test-Path "$env:RUNNER_TEMP\v8\include\v8.h")) { throw "V8 headers missing" }

      - name: Configure Unix
        if: runner.os != 'Windows'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DV8_DIR="$RUNNER_TEMP/v8"

      - name: Configure Windows
        if: runner.os == 'Windows'
        run: cmake -B build -A x64 -DV8_DIR="$env:RUNNER_TEMP\v8"

      - name: Build
        run: cmake --build build --config Release

      - name: Smoke test Unix
        if: runner.os != 'Windows'
        run: |
          ./build/elyxion --version
          ./build/elyxion examples/hello.js
          ./build/elyxion test/basic.test.js

      - name: Smoke test Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\build\Release\elyxion.exe --version
          .\build\Release\elyxion.exe examples\hello.js
          .\build\Release\elyxion.exe test\basic.test.js

      - name: Assemble Unix archive
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist/bin dist/lib
          cp build/elyxion dist/elyxion.bin
          cp -r build/runtime/lib/. dist/lib/
          cp bin/elyx dist/bin/
          cp bin/elyxion dist/bin/
          cp bin/elyxion.cmd bin/elyx.cmd dist/bin/
          cp README.md LICENSE dist/
          tar -czf "${{ matrix.artifact }}.tar.gz" -C dist .

      - name: Assemble Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dist = "${{ matrix.artifact }}"
          New-Item -ItemType Directory -Force "$dist\bin", "$dist\lib" | Out-Null
          Copy-Item build\Release\elyxion.exe "$dist\bin\"
          Copy-Item -Recurse build\runtime\lib\* "$dist\lib\"
          Copy-Item bin\elyx.cmd, bin\elyxion.cmd "$dist\bin\"
          Copy-Item README.md, LICENSE "$dist\"
          Compress-Archive -Path $dist -DestinationPath "${{ matrix.artifact }}.zip"

      - name: Upload Unix archive
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz

      - name: Upload Windows archive
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip

  publish:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
