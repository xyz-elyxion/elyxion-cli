name: Nightly Build

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

env:
  V8_SDK_URL: ${{ vars.V8_SDK_URL }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools and V8 SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ make curl xz-utils tar
          test -n "$V8_SDK_URL"
          mkdir -p "$RUNNER_TEMP/v8"
          curl -fsSL "$V8_SDK_URL" | tar -xJ --strip-components=1 -C "$RUNNER_TEMP/v8"

      - name: Build standalone runtime
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DV8_DIR="$RUNNER_TEMP/v8"
          cmake --build build --config Release
          ./build/elyxion --version
          ./build/elyxion examples/hello.js

      - name: Upload runtime
        uses: actions/upload-artifact@v4
        with:
          name: elyxion-linux-nightly
          path: |
            build/elyxion
            build/runtime/lib
