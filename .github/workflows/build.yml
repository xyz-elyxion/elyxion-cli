name: Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  V8_SDK_URL: ${{ vars.V8_SDK_URL }}

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Unix build tools
        if: runner.os != 'Windows'
        run: |
          brew install cmake || true
          test -n "$V8_SDK_URL"
          mkdir -p "$RUNNER_TEMP/v8"
          curl -fsSL "$V8_SDK_URL" | tar -xJ --strip-components=1 -C "$RUNNER_TEMP/v8"

      - name: Download V8 SDK on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not $env:V8_SDK_URL) { throw "V8_SDK_URL is not configured" }
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\v8" | Out-Null
          Invoke-WebRequest -Uri $env:V8_SDK_URL -OutFile "$env:RUNNER_TEMP\v8.tar.xz"
          tar -xf "$env:RUNNER_TEMP\v8.tar.xz" -C "$env:RUNNER_TEMP\v8" --strip-components=1

      - name: Configure Unix
        if: runner.os != 'Windows'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DV8_DIR="$RUNNER_TEMP/v8"

      - name: Configure Windows
        if: runner.os == 'Windows'
        run: cmake -B build -A x64 -DV8_DIR="$env:RUNNER_TEMP\v8"

      - name: Build
        run: cmake --build build --config Release

      - name: Smoke test Unix
        if: runner.os != 'Windows'
        run: |
          ./build/elyxion --version
          ./build/elyxion examples/hello.js

      - name: Smoke test Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\build\Release\elyxion.exe --version
          .\build\Release\elyxion.exe examples\hello.js

      - name: Upload standalone artifact
        uses: actions/upload-artifact@v4
        with:
          name: elyxion-${{ matrix.os }}
          path: |
            build/elyxion
            build/Release/elyxion.exe
            build/runtime/lib
