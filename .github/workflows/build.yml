name: Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [20.x, 22.x]

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Install Dependencies
      shell: bash
      run: npm install --ignore-scripts

    # ---- Linux / macOS Build ----
    - name: Configure CMake (Linux/macOS)
      if: runner.os != 'Windows'
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build (Linux/macOS)
      if: runner.os != 'Windows'
      run: cmake --build build --config Release

    # ---- Windows Build ----
    - name: Configure CMake (Windows)
      if: runner.os == 'Windows'
      run: cmake -B build -A x64

    - name: Build (Windows)
      if: runner.os == 'Windows'
      run: cmake --build build --config Release

    # ---- Verify Build ----
    - name: Verify Build
      shell: bash
      run: |
        echo "=== Build Artifacts ==="
        find build/ -name "*.node" -o -name "*.so" -o -name "*.dylib" -o -name "*.dll" 2>/dev/null || true
        ls -la build/Release/ 2>/dev/null || ls -la build/ 2>/dev/null || true

    # ---- Run Tests ----
    - name: Test
      run: node test/basic.test.js

  # ---- Universal macOS Binary (x64 + arm64) ----
  build-macos-universal:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: macos-latest
    needs: build

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node.js 22.x
      uses: actions/setup-node@v4
      with:
        node-version: 22.x

    - name: Install Dependencies
      run: npm install --ignore-scripts

    # Build x64
    - name: Build x64
      run: |
        cmake -B build-x64 -DCMAKE_BUILD_TYPE=Release
        cmake --build build-x64 --config Release
        cp build-x64/Release/elyxion.node build/elyxion-x64.node 2>/dev/null || \
          cp build-x64/elyxion.node build/elyxion-x64.node 2>/dev/null || true
        mkdir -p build
        cp build-x64/Release/elyxion.node build/elyxion-x64.node 2>/dev/null || true

    # Build arm64
    - name: Build arm64
      run: |
        cmake -B build-arm64 -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64
        cmake --build build-arm64 --config Release
        mkdir -p build
        cp build-arm64/Release/elyxion.node build/elyxion-arm64.node 2>/dev/null || \
          cp build-arm64/elyxion.node build/elyxion-arm64.node 2>/dev/null || true

    # Create universal binary
    - name: Create Universal Binary
      run: |
        lipo -create build/elyxion-x64.node build/elyxion-arm64.node -output build/Release/elyxion.node
        lipo -info build/Release/elyxion.node

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: elyxion-macos-universal
        path: build/Release/elyxion.node

  # ---- Linux ARM64 via Docker ----
  build-linux-arm64:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: build

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build ARM64 via Docker
      run: |
        docker buildx build \
          --platform linux/arm64 \
          --load \
          --tag elyxion-arm64:latest \
          --file Dockerfile.arm64 \
          .

    - name: Extract ARM64 Binary
      run: |
        docker create --name extract elyxion-arm64:latest
        docker cp extract:/app/build/Release/elyxion.node build/elyxion-arm64.node
        docker rm extract

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: elyxion-linux-arm64
        path: build/elyxion-arm64.node
